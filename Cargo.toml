[package]
name = "wkhtml-rs"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Drop-in wkhtmltopdf replacement for Odoo, built on fulgur (pure Rust, no browser)"

[[bin]]
name = "wkhtmltopdf"
path = "src/main.rs"

[dependencies]
fulgur = { path = "../fulgur/crates/fulgur" }
anyhow = "1"
lopdf = "0.44"
base64 = "0.23.1"
regex = "1.13.1"

[profile.release]
lto = true
strip = true
opt-level = 3


[dev-dependencies]
tempfile = "3.27.0"
